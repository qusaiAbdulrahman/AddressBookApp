<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Buddy</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<h1>Add Buddy to AddressBook</h1>

<!-- Form to add buddy -->
<form id="addBuddyForm">
    <!-- Here we are using th:value to bind the addressBookId from the Thymeleaf model -->
    <input type="hidden" id="addressBookId" th:value="${addressBookId}">

    <label for="name">Buddy Name:</label>
    <input type="text" id="name" name="name" required>
    <br>
    <label for="phone">Buddy Phone Number:</label>
    <input type="text" id="phone" name="phoneNumber" required>
    <br>
    <button type="submit">Add Buddy</button>
</form>

<!-- Table to display buddies -->
<h2>Buddies in AddressBook</h2>
<table id="buddyList" border="1">
    <thead>
    <tr>
        <th>Buddy Name</th>
        <th>Phone Number</th>
    </tr>
    </thead>
    <tbody>
    <!-- Buddy list will be dynamically populated here -->
    </tbody>
</table>

<!-- Place your JavaScript code just before the closing body tag -->
<script type="text/javascript">
    $(document).ready(function() {
        console.log("JavaScript is running!");

        // Handle form submission with AJAX
        $("#addBuddyForm").submit(function(event) {
            event.preventDefault();  // Prevent form submission

            var buddyData = {
                name: $("#name").val(),
                phoneNumber: $("#phone").val()
            };

            var addressBookId = $("#addressBookId").val();  // Now get the value from the hidden input field

            console.log("Adding buddy: ", buddyData);
            console.log("AddressBook ID: ", addressBookId);

            $.ajax({
                type: "POST",
                url: "/api/addressbook/" + addressBookId + "/addBuddy",  // Correct URL
                contentType: "application/json",  // Specify that you're sending JSON
                data: JSON.stringify(buddyData),  // Convert JS object to JSON string
                success: function(response) {
                    alert("Buddy added successfully!");
                    console.log("Response: ", response);
                    loadBuddies();  // Call function to load updated buddy list
                },
                error: function(xhr, status, error) {
                    alert("Error adding buddy: " + xhr.responseText);
                    console.log("Error: ", error);
                }
            });
        });

        // Function to load buddies (GET request)
        function loadBuddies() {
            console.log("Loading buddies...");
            $.ajax({
                type: "GET", // Use GET to retrieve buddies
                url: "/api/addressbook/" + $("#addressBookId").val() + "/buddies",
                success: function(data) {
                    console.log("Buddies loaded (raw):", data); // Log the raw data
                    var buddyList = $("#buddyList tbody");
                    buddyList.empty(); // Clear existing buddy list

                    // Append new buddy data
                    data.forEach(function(buddy) {
                        console.log("Buddy details:", buddy);  // Log each buddy's details
                        buddyList.append("<tr><td>" + buddy.name + "</td><td>" + buddy.phoneNumber + "</td></tr>");
                    });
                },
                error: function(xhr, status, error) {
                    alert("Error loading buddies: " + xhr.responseText);
                    console.log("Error loading buddies: ", error);
                }
            });
        }


        // Load buddies when the page is ready
        loadBuddies();
    });
</script>
</body>
</html>
